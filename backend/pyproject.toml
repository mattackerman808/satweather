[project]
name = "satweather"
version = "0.1.0"
description = "GOES-18 HRIT / EMWIN weather viewer backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "geoalchemy2>=0.16",
    "pydantic-settings>=2.6",
    # NWS text product parsers (VTEC, UGC, polygons, METAR). Heavy: pulls
    # pandas/geopandas/pyogrio, which refdata also uses for shapefiles.
    "pyiem>=1.28",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "httpx>=0.28"]

[project.scripts]
satweather-migrate = "satweather.db.migrate:main"
satweather-ingest = "satweather.ingest:main"
satweather-refdata = "satweather.refdata:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["satweather*"]

[tool.setuptools.package-data]
"satweather.db" = ["alembic.ini", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
