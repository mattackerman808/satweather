name: Build and publish satweather deb

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Backend tests
        run: |
          pip install -e "backend[test]"
          make test

      # The run attempt is part of the version: re-running a workflow with
      # the same version would collide in aptly and wedge the repo.
      - name: Set version
        id: version
        run: |
          v="$(date -u +%-y.%-m.%-d).${{ github.run_number }}"
          if [ "${{ github.run_attempt }}" != "1" ]; then v="$v.${{ github.run_attempt }}"; fi
          echo "ver=$v" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: make deb VERSION=${{ steps.version.outputs.ver }}

      - name: Publish
        run: |
          curl -f -H "Authorization: Bearer ${{ secrets.REPO_API_KEY }}" \
            --upload-file build/satweather_${{ steps.version.outputs.ver }}_all.deb \
            https://apt-upload.808.org/upload/satweather_${{ steps.version.outputs.ver }}_all.deb
