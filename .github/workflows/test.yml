name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: satweather
          POSTGRES_PASSWORD: satweather
          POSTGRES_DB: satweather_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U satweather" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SATWEATHER_TEST_DATABASE_URL: postgresql+psycopg://satweather:satweather@127.0.0.1:5432/satweather_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests
        run: |
          pip install -e "backend[test]"
          make test

      - name: Frontend typecheck and build
        run: make web
